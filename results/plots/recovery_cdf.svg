<text x="16" y="26" class="t1" font-size="16" font-weight="600">Recovery after a carrier failure (empirical CDF)</text>
<text x="16" y="46" class="t2" font-size="12">at06_drone_failure, 8 seeds per system: the first carrier after 120 s is killed 10 s after its pickup. Curves stay below 1 for runs never recovered.</text>
