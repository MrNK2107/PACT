# Rural flatland with ageing batteries: long legs, one pad per depot and a 1.5x drain from t=300 s.
name: fr_battery_crunch
map: flatland_rural
tier: hard
description: Battery drain x1.5 from t=300 s on a map with one pad per depot. Reserve and pad scarcity decide who delivers.
duration_s: 3600
fleet: { n_drones: 8, capacity_kg: 2.0, speed_mps: 15, battery_wh: 120 }
workload:
  arrival_rate_per_min: 1.6
  priority_mix: [0.1, 0.3, 0.6]
  deadline_s: { 1: [600, 1200], 2: [1200, 2400], 3: [2400, 4800] }
network: { loss: 0.0, latency_ms: [50, 800], range_m: 3000 }
policy: { partition: QUORUM }
faults:
  - { t: 300, type: battery_drain, id: all, factor: 1.5 }
