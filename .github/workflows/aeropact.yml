# AeroPACT CI. ROS-free jobs: everything here runs on a stock Ubuntu runner without ROS 2, colcon or Gazebo.
# The full ROS 2 build, ament linters and acceptance scenarios still need `make test` /
# `make scenarios` in the devcontainer or docker/Dockerfile.
name: aeropact

on:
  push:
    paths: ['aeropact/**', '.github/workflows/aeropact.yml']
  pull_request:
    paths: ['aeropact/**', '.github/workflows/aeropact.yml']
  workflow_dispatch:

permissions:
  contents: read

# The ROS 2 workspace lives in aeropact/ (the TypeScript simulator in sim3d/ has its own workflow).
defaults:
  run:
    working-directory: aeropact

concurrency:
  group: aeropact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pure-Python tests (eval, world generator, properties)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aeropact/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff==0.6.9
      - name: ruff (new ROS-free test code)
        run: ruff check tests
      - name: pytest
        env:
          PYTHONPATH: src/aeropact_eval
          HYPOTHESIS_PROFILE: ci
        run: >
          python -m pytest -q -p no:cacheprovider --rootdir=.
          tests
          src/aeropact_eval/test/test_metrics.py
          src/aeropact_eval/test/test_shots.py
          src/aeropact_sim/test/test_world_generator.py

  core:
    name: C++ core (CRDT, leases, auction, planner) without ROS + hypothesis on the real merge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ cmake libyaml-cpp-dev libgtest-dev libssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build aeropact_core (standalone CMake)
        run: |
          cmake -S ci/core -B build-core -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-core -j"$(nproc)"
      - name: gtest suites (merge join laws, ownership, partition policies, ...)
        run: ctest --test-dir build-core --output-on-failure
      - name: hypothesis properties of the C++ merge
        env:
          AEROPACT_MERGE_ORACLE: build-core/merge_oracle
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest -q -p no:cacheprovider tests/test_crdt_merge_hypothesis.py

  ros:
    name: ROS 2 Jazzy build, unit/property tests and ament linters (no PX4, no scenarios)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (rosdep)
        shell: bash
        run: |
          apt-get update -qq
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y -q --rosdistro jazzy --skip-keys px4_msgs
      - name: Build (aeropact_px4 builds its logic only without the px4_msgs underlay)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Unit, property and loopback tests; ament linters
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash && source install/setup.bash
          colcon test --ctest-args -LE scenario
          colcon test-result --verbose
