# ROS-free CI: everything here runs on a stock Ubuntu runner without ROS 2, colcon or Gazebo.
# The full ROS 2 build, ament linters and acceptance scenarios still need `make test` /
# `make scenarios` in the devcontainer or docker/Dockerfile.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pure-Python tests (eval, world generator, properties)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff==0.6.9
      - name: ruff (new ROS-free test code)
        run: ruff check tests
      - name: pytest
        env:
          PYTHONPATH: src/aeropact_eval
          HYPOTHESIS_PROFILE: ci
        run: >
          python -m pytest -q -p no:cacheprovider --rootdir=.
          tests
          src/aeropact_eval/test/test_metrics.py
          src/aeropact_sim/test/test_world_generator.py

  core:
    name: C++ core (CRDT, leases, auction, planner) without ROS + hypothesis on the real merge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ cmake libyaml-cpp-dev libgtest-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build aeropact_core (standalone CMake)
        run: |
          cmake -S ci/core -B build-core -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-core -j"$(nproc)"
      - name: gtest suites (merge join laws, ownership, partition policies, ...)
        run: ctest --test-dir build-core --output-on-failure
      - name: hypothesis properties of the C++ merge
        env:
          AEROPACT_MERGE_ORACLE: build-core/merge_oracle
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest -q -p no:cacheprovider tests/test_crdt_merge_hypothesis.py
